name: Build and push resume PDF

on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone resume repository
        env:
          RESUME_REPO_PAT: ${{ secrets.RESUME_REPO_PAT }}
        run: |
          rm -rf resume || true
          if [ -z "$RESUME_REPO_PAT" ]; then
            echo "RESUME_REPO_PAT not set; attempting anonymous clone (read-only)"
            git clone https://github.com/angelorscoelho/resume.git resume
          else
            git clone https://$RESUME_REPO_PAT@github.com/angelorscoelho/resume.git resume
          fi

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-xetex latexmk

      - name: Build resume PDF
        run: |
          cd resume
          if [ -f Makefile ] || [ -f makefile ]; then
            make
          else
            MAIN_TEX=$(ls *.tex 2>/dev/null | head -n1 || true)
            if [ -n "$MAIN_TEX" ]; then
              latexmk -pdf -interaction=nonstopmode "$MAIN_TEX"
            else
              echo "No .tex file found in resume repo"; exit 1
            fi
          fi

      - name: Copy built PDF into site assets and push
        run: |
          # ── 1. Resolve the HEAD commit of the resume repo (always authoritative) ──
          RESUME_SHA=$(git -C resume rev-parse HEAD)
          RESUME_SHA_SHORT="${RESUME_SHA: -8}"

          # ── 2. Read source-commit info from resume-meta.json (if the resume CI
          #       wrote one).  The source SHA is the human commit that triggered
          #       the resume CI; HEAD may be one commit later (the CI bot commit).
          SOURCE_SHA=""
          SOURCE_SHA_SHORT=""
          if [ -f resume/resume-meta.json ]; then
            SOURCE_SHA=$(jq -r '.sha // empty' resume/resume-meta.json)
            # Match the published resume artifact suffix by using the last 8
            # characters of the triggering commit SHA.
            if [ -n "$SOURCE_SHA" ]; then
              SOURCE_SHA_SHORT="${SOURCE_SHA: -8}"
            fi
          fi

          # ── 3. Pick the best PDF (prefer the compressed/named artifact) ──
          PDF=""
          if [ -n "$SOURCE_SHA_SHORT" ]; then
            # The resume CI names the compressed artifact angelorscoelho_resume_<suffix>.pdf
            PDF=$(find resume -maxdepth 2 -name "angelorscoelho_resume_*.pdf" 2>/dev/null | head -n1)
          fi
          if [ -z "$PDF" ]; then
            PDF=$(find resume -maxdepth 2 -name 'resume.pdf' 2>/dev/null | head -n1)
          fi
          if [ -z "$PDF" ]; then
            PDF=$(find resume -maxdepth 2 -name 'main.pdf' 2>/dev/null | head -n1)
          fi
          if [ -z "$PDF" ]; then
            echo "No PDF found after build; aborting."; exit 1
          fi
          echo "Using PDF: $PDF"

          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p src/assets
          cp "$PDF" src/assets/resume.pdf

          # ── 4. Write traceability metadata alongside the PDF ──
          # "sha" / "shaShort" always reflect the resume repo HEAD — the exact
          # tree state the PDF was taken from.  "sourceSha" captures the human
          # commit that triggered the resume CI (may equal sha when no CI bot
          # commit exists).
          cat > src/assets/resume-meta.json <<METAEOF
          {
            "sha": "${RESUME_SHA}",
            "shaShort": "${RESUME_SHA_SHORT}",
            "sourceSha": "${SOURCE_SHA:-${RESUME_SHA}}",
            "sourceShaShort": "${SOURCE_SHA_SHORT:-${RESUME_SHA_SHORT}}",
            "builtAt": "${BUILT_AT}",
            "resumeCommitUrl": "https://github.com/angelorscoelho/resume/commit/${RESUME_SHA}",
            "resumeWorkflowUrl": "https://github.com/angelorscoelho/resume/actions/workflows/build-and-publish-resume.yml"
          }
          METAEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/resume.pdf src/assets/resume-meta.json
          git commit -m "ci: update resume.pdf [sha: ${RESUME_SHA_SHORT}]" || echo "no changes to commit"
          git push origin HEAD:main
